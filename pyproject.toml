[project]
name = "colony8"
version = "0.1.0"
description = "Transactional shared memory for multi-agent fleets on CockroachDB + AWS Bedrock"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "anthropic[bedrock]>=0.40",
    "boto3>=1.34",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mangum>=0.17",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
